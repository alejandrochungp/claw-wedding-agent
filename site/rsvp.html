<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Confirmar asistencia — Alejandro &amp; Kuilen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="page-header">
  <h1>Confirmar asistencia</h1>
  <p>Alejandro &amp; Kuilen · 17 Nov 2026 · Restaurante Meihua</p>
</header>

<main class="container narrow">
  <div class="rsvp-form" id="rsvp-form">
    <p><strong>¿Vienes a nuestra boda?</strong> Cuéntanos para tener todo listo 🥂</p>

    <label for="name">Nombre completo</label>
    <input type="text" id="name" name="name" required placeholder="Tu nombre">

    <label for="phone">Teléfono (WhatsApp)</label>
    <input type="tel" id="phone" name="phone" placeholder="+56 9 ...">

    <label>¿Asistirás?</label>
    <div class="rsvp-radio">
      <label><input type="radio" name="attending" value="si" checked> Sí, allá estaré 🎉</label>
      <label><input type="radio" name="attending" value="no"> No podré 😢</label>
      <label><input type="radio" name="attending" value="talvez"> Tal vez 🤔</label>
    </div>

    <label for="guests">N° de acompañantes</label>
    <input type="number" id="guests" name="guests" min="0" max="5" value="0">
    <p id="cupo-note" style="margin:4px 0 0; font-size:.85rem; color:#8B3232; display:none;"></p>

    <label for="diet">Restricciones alimentarias</label>
    <textarea id="diet" name="diet" rows="2" placeholder="Alergias, vegetariano, etc. (opcional)"></textarea>

    <label for="parking">¿Necesitas estacionamiento?</label>
    <div class="rsvp-radio">
      <label><input type="radio" name="parking" value="si"> Sí</label>
      <label><input type="radio" name="parking" value="no" checked> No</label>
    </div>

    <label for="message">Mensaje para los novios (opcional)</label>
    <textarea id="message" name="message" rows="2" placeholder="Algo lindo para ellos..."></textarea>

    <button type="submit" class="btn btn-solid" id="submit-rsvp">Enviar confirmación</button>
    <p id="rsvp-status" style="margin-top:14px; font-size:0.95rem;"></p>
  </div>
</main>

<footer class="footer">
  <p>Alejandro &amp; Kuilen — 17 Nov 2026</p>
</footer>

<a class="wa-float" href="https://wa.me/56994635497" target="_blank" aria-label="WhatsApp">💬</a>

<script>
var CUPO_MAX = null;

// Prefill por teléfono: si la URL trae ?phone=, consultamos el cupo asignado al backend
(function () {
  var params = new URLSearchParams(window.location.search);
  var phoneParam = params.get('phone');
  if (!phoneParam) return;

  var nameEl = document.getElementById('name');
  var phoneEl = document.getElementById('phone');
  var guestsEl = document.getElementById('guests');
  var cupoNote = document.getElementById('cupo-note');

  // Prellenar SIEMPRE el teléfono desde la URL (aunque el invitado no esté registrado)
  phoneEl.value = phoneParam;

  fetch('https://claw-wedding-agent-production.up.railway.app/api/rsvp/guest?phone=' + encodeURIComponent(phoneParam))
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data.found) return;
      if (data.name) nameEl.value = data.name;
      phoneEl.value = data.phone || phoneParam;
      phoneEl.readOnly = true;
      if (data.hasCupo) {
        CUPO_MAX = data.acompanantes;
        guestsEl.max = data.acompanantes;
        guestsEl.value = 0;
        cupoNote.textContent = 'Puedes confirmar solo/a (0) o con hasta ' + data.acompanantes + ' acompañante(s)';
        cupoNote.style.display = 'block';
      }
      clampGuests();
    })
    .catch(function () { /* sin conexión al backend: el invitado llena manual */ });
})();

// Limita en vivo el campo de acompañantes: no deja escribir más del tope (cupo o 5 por defecto)
function clampGuests() {
  var el = document.getElementById('guests');
  var max = (CUPO_MAX !== null) ? CUPO_MAX : 5;
  var n = parseInt(el.value, 10);
  if (isNaN(n) || n < 0) { el.value = 0; return; }
  if (n > max) el.value = max;
}
document.getElementById('guests').addEventListener('input', clampGuests);

document.getElementById('submit-rsvp').addEventListener('click', function () {
  var name = document.getElementById('name').value.trim();
  var phone = document.getElementById('phone').value.trim();
  var attending = document.querySelector('input[name="attending"]:checked').value;
  var guestsVal = parseInt(document.getElementById('guests').value, 10) || 0;
  var guests = (CUPO_MAX !== null) ? Math.max(0, Math.min(guestsVal, CUPO_MAX)) : guestsVal;
  var diet = document.getElementById('diet').value.trim();
  var parking = document.querySelector('input[name="parking"]:checked').value;
  var message = document.getElementById('message').value.trim();
  var status = document.getElementById('rsvp-status');

  if (!name) { status.textContent = '⚠️ Escribe tu nombre'; status.style.color = '#8B3232'; return; }

  var asistencia = attending === 'si' ? 'SÍ 🎉' : (attending === 'no' ? 'NO 😢' : 'TAL VEZ 🤔');
  var texto = 'Hola! Confirmo mi asistencia a la boda:\n\n'
    + '👤 ' + name + '\n'
    + '📱 ' + (phone || '-') + '\n'
    + '✅ Asistencia: ' + asistencia + '\n'
    + '👥 Acompañantes: ' + guests + '\n'
    + '🍽 Restricciones: ' + (diet || '-') + '\n'
    + '🅿️ Estacionamiento: ' + (parking === 'si' ? 'Sí' : 'No') + '\n'
    + (message ? '💌 Mensaje: ' + message : '');

  // Enviar vía WhatsApp (el bot procesa el RSVP y confirma)
  window.open('https://wa.me/56994635497?text=' + encodeURIComponent(texto), '_blank');
  status.textContent = '✅ ¡Gracias! Te redirigimos a WhatsApp para confirmar. Si no se abrió, escríbenos directo.';
  status.style.color = '#2e7d32';
});
</script>
</body>
</html>
