<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Confirmar asistencia — Alejandro &amp; Kuilen</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/minisitio.css">
<style>
  .ms-narrow { max-width: 720px; }
  .ms-rsvp-head { text-align: center; padding: 46px 0 4px; }
  .ms-rsvp-head h1 { font-family: var(--font-heading); color: var(--color-primary); font-size: clamp(2rem, 5vw, 2.8rem); margin-bottom: 6px; }
  .ms-rsvp-head p { opacity: .85; }
  .rsvp-form { background: #fff; border-radius: 14px; padding: 34px; box-shadow: 0 4px 18px rgba(60,36,21,.1); margin: 26px 0 56px; }
  .rsvp-form label { display: block; font-weight: 700; margin: 18px 0 6px; color: var(--color-primary); }
  .rsvp-form input[type="text"], .rsvp-form input[type="tel"], .rsvp-form input[type="number"], .rsvp-form textarea {
    width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; font-family: var(--font-body); font-size: 1rem;
  }
  .rsvp-form input:focus, .rsvp-form textarea:focus { outline: 2px solid var(--color-secondary); border-color: transparent; }
  .rsvp-radio { display: flex; gap: 18px; margin-top: 6px; flex-wrap: wrap; }
  .rsvp-radio label { font-weight: 400; color: var(--color-text); display: flex; align-items: center; gap: 6px; margin: 0; cursor: pointer; }
  .rsvp-form .btn { margin-top: 26px; width: 100%; text-align: center; cursor: pointer; font-size: 1.05rem; }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper-btn { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--color-secondary); background: #fff; color: var(--color-primary); font-size: 1.5rem; line-height: 1; cursor: pointer; font-weight: 700; transition: background .15s, color .15s, opacity .15s; }
  .stepper-btn:hover:not(:disabled) { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
  .stepper-btn:disabled { opacity: .35; cursor: not-allowed; }
  .stepper-value { min-width: 40px; text-align: center; font-size: 1.5rem; font-weight: 700; color: var(--color-text); }
  .wa-float { position: fixed; bottom: 22px; right: 22px; width: 56px; height: 56px; background: #25D366; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.7rem; text-decoration: none; box-shadow: 0 4px 14px rgba(0,0,0,.25); z-index: 99; }
  .wa-float:hover { transform: scale(1.08); }
</style>
</head>
<body>
<header class="ms-header">
  <div class="container ms-header-inner">
    <a class="ms-brand" href="/" aria-label="Nos Casamos"><img class="ms-brand-logo" src="/assets/logo-noscasamos.svg" alt="Nos Casamos" width="170" height="59"></a>
    <button class="ms-nav-toggle" id="ms-nav-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="ms-nav">☰</button>
    <nav class="ms-nav" id="ms-nav">
      <a href="/">Inicio</a>
      <a href="/?page=info">Info</a>
      <a href="/?page=galeria">Galería</a>
      <a href="/?page=regalos">Regalos</a>
      <a href="/rsvp.html" class="active">RSVP</a>
      <a href="/editar" id="nav-panel">Mi panel</a>
    </nav>
  </div>
</header>

<main class="container ms-narrow">
  <div class="ms-rsvp-head">
    <h1>Confirmar asistencia</h1>
    <p>Alejandro &amp; Kuilen · 17 Nov 2026 · Restaurante Meihua</p>
  </div>

  <div class="rsvp-form" id="rsvp-form">
    <p><strong>¿Vienes a nuestra boda?</strong> Cuéntanos para tener todo listo 🥂</p>

    <label for="name">Nombre completo</label>
    <input type="text" id="name" name="name" required placeholder="Tu nombre">

    <label for="phone">Teléfono (WhatsApp)</label>
    <input type="tel" id="phone" name="phone" placeholder="+56 9 ...">

    <label>¿Asistirás?</label>
    <div class="rsvp-radio">
      <label><input type="radio" name="attending" value="si" checked> Sí, allá estaré 🎉</label>
      <label><input type="radio" name="attending" value="no"> No podré 😢</label>
      <label><input type="radio" name="attending" value="talvez"> Tal vez 🤔</label>
    </div>

    <label>N° de acompañantes</label>
    <div class="stepper" id="guests-stepper">
      <button type="button" id="guests-minus" class="stepper-btn" aria-label="Quitar acompañante">−</button>
      <span id="guests" class="stepper-value">0</span>
      <button type="button" id="guests-plus" class="stepper-btn" aria-label="Agregar acompañante">+</button>
    </div>
    <p id="cupo-note" style="margin:4px 0 0; font-size:.85rem; color:#8B3232; display:none;"></p>

    <label for="diet">Restricciones alimentarias</label>
    <textarea id="diet" name="diet" rows="2" placeholder="Alergias, vegetariano, etc. (opcional)"></textarea>

    <label for="parking">¿Necesitas estacionamiento?</label>
    <div class="rsvp-radio">
      <label><input type="radio" name="parking" value="si"> Sí</label>
      <label><input type="radio" name="parking" value="no" checked> No</label>
    </div>

    <label for="message">Mensaje para los novios (opcional)</label>
    <textarea id="message" name="message" rows="2" placeholder="Algo lindo para ellos..."></textarea>

    <button type="submit" class="btn btn-primary" id="submit-rsvp">Enviar confirmación</button>
    <p id="rsvp-status" style="margin-top:14px; font-size:0.95rem;"></p>
  </div>
</main>

<footer class="ms-footer">
  <div class="container">
    <span>Hecho con <a href="https://noscasamos.vip" target="_blank" rel="noopener">Nos Casamos</a> · © 2026</span>
    <a id="panel-link" href="/editar">Mi panel</a>
  </div>
</footer>

<a class="wa-float" href="https://wa.me/56994635497" target="_blank" aria-label="WhatsApp">💬</a>

<script>
// Menú hamburguesa en mobile (mismo comportamiento que el resto del minisitio)
(function () {
  var tgl = document.getElementById('ms-nav-toggle');
  var nav = document.getElementById('ms-nav');
  if (!tgl || !nav) { return; }
  tgl.addEventListener('click', function () {
    var abierto = nav.classList.toggle('open');
    tgl.setAttribute('aria-expanded', String(abierto));
    tgl.textContent = abierto ? '✕' : '☰';
  });
  nav.addEventListener('click', function (e) {
    if (e.target && e.target.tagName === 'A') {
      nav.classList.remove('open');
      tgl.setAttribute('aria-expanded', 'false');
      tgl.textContent = '☰';
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      nav.classList.remove('open');
      tgl.setAttribute('aria-expanded', 'false');
      tgl.textContent = '☰';
    }
  });
  window.addEventListener('resize', function () {
    if (window.innerWidth > 820 && nav.classList.contains('open')) {
      nav.classList.remove('open');
      tgl.setAttribute('aria-expanded', 'false');
      tgl.textContent = '☰';
    }
  });
})();

var CUPO_MAX = null;
var GUESTS = 0;

function maxGuests() { return (CUPO_MAX !== null) ? CUPO_MAX : 5; }

function renderGuests() {
  var valueEl = document.getElementById('guests');
  var minusBtn = document.getElementById('guests-minus');
  var plusBtn = document.getElementById('guests-plus');
  valueEl.textContent = GUESTS;
  minusBtn.disabled = (GUESTS <= 0);
  plusBtn.disabled = (GUESTS >= maxGuests());
}

document.getElementById('guests-minus').addEventListener('click', function () {
  if (GUESTS > 0) { GUESTS--; renderGuests(); }
});
document.getElementById('guests-plus').addEventListener('click', function () {
  if (GUESTS < maxGuests()) { GUESTS++; renderGuests(); }
});

// Prefill por teléfono: si la URL trae ?phone=, consultamos el cupo asignado al backend
(function () {
  var params = new URLSearchParams(window.location.search);
  var phoneParam = params.get('phone');
  if (!phoneParam) { renderGuests(); return; }

  var nameEl = document.getElementById('name');
  var phoneEl = document.getElementById('phone');
  var cupoNote = document.getElementById('cupo-note');

  // Prellenar SIEMPRE el teléfono desde la URL (aunque el invitado no esté registrado)
  phoneEl.value = phoneParam;

  fetch('https://claw-wedding-agent-production.up.railway.app/api/rsvp/guest?phone=' + encodeURIComponent(phoneParam))
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data.found) { renderGuests(); return; }
      if (data.name) nameEl.value = data.name;
      phoneEl.value = data.phone || phoneParam;
      phoneEl.readOnly = true;
      if (data.hasCupo) {
        CUPO_MAX = data.acompanantes;
        GUESTS = 0;
        cupoNote.textContent = 'Puedes confirmar solo/a (0) o con hasta ' + data.acompanantes + ' acompañante(s)';
        cupoNote.style.display = 'block';
      }
      renderGuests();
    })
    .catch(function () { renderGuests(); });
})();

document.getElementById('submit-rsvp').addEventListener('click', function () {
  var name = document.getElementById('name').value.trim();
  var phone = document.getElementById('phone').value.trim();
  var attending = document.querySelector('input[name="attending"]:checked').value;
  var guests = GUESTS;
  var diet = document.getElementById('diet').value.trim();
  var parking = document.querySelector('input[name="parking"]:checked').value;
  var message = document.getElementById('message').value.trim();
  var status = document.getElementById('rsvp-status');

  if (!name) { status.textContent = '⚠️ Escribe tu nombre'; status.style.color = '#8B3232'; return; }

  var asistencia = attending === 'si' ? 'SÍ 🎉' : (attending === 'no' ? 'NO 😢' : 'TAL VEZ 🤔');
  var texto = 'Hola! Confirmo mi asistencia a la boda:\n\n'
    + '👤 ' + name + '\n'
    + '📱 ' + (phone || '-') + '\n'
    + '✅ Asistencia: ' + asistencia + '\n'
    + '👥 Acompañantes: ' + guests + '\n'
    + '🍽 Restricciones: ' + (diet || '-') + '\n'
    + '🅿️ Estacionamiento: ' + (parking === 'si' ? 'Sí' : 'No') + '\n'
    + (message ? '💌 Mensaje: ' + message : '');

  // Enviar vía WhatsApp (el bot procesa el RSVP y confirma)
  window.open('https://wa.me/56994635497?text=' + encodeURIComponent(texto), '_blank');
  status.textContent = '✅ ¡Gracias! Te redirigimos a WhatsApp para confirmar. Si no se abrió, escríbenos directo.';
  status.style.color = '#2e7d32';
});
</script>
</body>
</html>
