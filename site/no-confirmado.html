<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>No podrás venir — Alejandro &amp; Kuilen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .decline-form { max-width: 420px; margin: 26px auto 0; text-align: left; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 3px 14px rgba(60,36,21,.08); }
  .decline-form label { display: block; font-weight: 700; font-size: .9rem; margin: 12px 0 4px; }
  .decline-form input, .decline-form textarea { width: 100%; padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-family: var(--font-body); font-size: .95rem; }
  .decline-form input:focus, .decline-form textarea:focus { outline: none; border-color: var(--color-secondary); }
  .decline-form .btn { width: 100%; margin-top: 18px; text-align: center; }
  .decline-note { font-size: .8rem; opacity: .6; margin-top: 10px; text-align: center; }
</style>
</head>
<body>
<main class="container">
  <div class="confirm">
    <div class="confirm-icon">💌</div>
    <h1>Te vamos a extrañar</h1>
    <p>Lamentamos que no puedas acompañarnos el <strong>17 de Noviembre de 2026</strong>. ¡Nos vemos pronto en otra ocasión!</p>

    <form class="decline-form" id="decline-form">
      <label for="name">Tu nombre</label>
      <input type="text" id="name" placeholder="Nombre y apellido" required>

      <label for="phone">Tu WhatsApp (opcional)</label>
      <input type="tel" id="phone" placeholder="+56 9 1234 5678">

      <label for="message">Mensaje para los novios (opcional)</label>
      <textarea id="message" rows="2" placeholder="Un saludo, un recuerdo..."></textarea>

      <button type="submit" class="btn btn-primary">Avisar por WhatsApp 💬</button>
      <p class="decline-note">Se abre WhatsApp con tu mensaje listo para enviar (así queda registrado).</p>
    </form>

    <p style="margin-top:20px;">¿Cambiaste de opinión? <a href="rsvp.html">✅ Confirmar asistencia</a></p>
  </div>
</main>
<footer class="footer">
  <p>Alejandro &amp; Kuilen — 17 Nov 2026</p>
</footer>

<a class="wa-float" href="https://wa.me/56994635497" target="_blank" aria-label="WhatsApp">💬</a>

<script>
// Prefill por teléfono si la URL trae ?phone=
(function () {
  var params = new URLSearchParams(window.location.search);
  var phoneParam = params.get('phone');
  if (!phoneParam) return;
  var nameEl = document.getElementById('name');
  var phoneEl = document.getElementById('phone');
  // Prellenar SIEMPRE el teléfono desde la URL (aunque el invitado no esté registrado)
  phoneEl.value = phoneParam;
  fetch('https://claw-wedding-agent-production.up.railway.app/api/rsvp/guest?phone=' + encodeURIComponent(phoneParam))
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data.found) return;
      if (data.name) nameEl.value = data.name;
      phoneEl.value = data.phone || phoneParam;
    })
    .catch(function () { /* sin backend: llena manual */ });
})();

document.getElementById('decline-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var name = document.getElementById('name').value.trim();
  var phone = document.getElementById('phone').value.trim();
  var message = document.getElementById('message').value.trim();
  if (!name) { alert('Escribe tu nombre'); return; }

  var texto = 'Hola! No podre asistir a la boda:\n\n'
    + '👤 ' + name + '\n'
    + '📱 ' + (phone || '-') + '\n'
    + '❌ Asistencia: NO 😢\n'
    + (message ? '💌 Mensaje: ' + message : '');

  window.open('https://wa.me/56994635497?text=' + encodeURIComponent(texto), '_blank');
});
</script>
</body>
</html>
